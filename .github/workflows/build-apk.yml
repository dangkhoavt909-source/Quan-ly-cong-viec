// ─── Add/Edit Task Modal ────────────────────────────────────────────────────
function TaskModal({ task, onClose, onSave }) {
  const [form, setForm] = useState(
    task || {
      title: "", description: "", date: formatDate(new Date()),
      startTime: "09:00", endTime: "10:00",
      priority: "medium", status: "pending",
      category: "dev", assignee: "", location: "", tags: [],
    }
  );
  const [tagInput, setTagInput] = useState("");

  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const addTag = () => {
    const t = tagInput.trim();
    if (t && !form.tags.includes(t)) { update("tags", [...form.tags, t]); setTagInput(""); }
  };

  const removeTag = (t) => update("tags", form.tags.filter((x) => x !== t));

  const handleSave = () => {
    if (!form.title.trim()) return;
    onSave({ ...form, id: form.id || Date.now() });
    onClose();
  };

  const inputStyle = {
    width: "100%", background: COLORS.bg, border: `1px solid ${COLORS.border}`,
    borderRadius: 10, padding: "10px 12px", color: COLORS.text,
    fontSize: 14, outline: "none", boxSizing: "border-box",
    fontFamily: "inherit",
  };
  const labelStyle = { fontSize: 12, color: COLORS.textMuted, marginBottom: 6, display: "block", fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase" };
  const rowStyle = { marginBottom: 16 };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 100, display: "flex", alignItems: "flex-end", backdropFilter: "blur(4px)" }}>
      <div style={{ background: COLORS.surface, borderRadius: "20px 20px 0 0", width: "100%", maxHeight: "92vh", overflowY: "auto", padding: 24, boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: COLORS.text, fontFamily: "'Sora', sans-serif" }}>
            {task ? "Chỉnh sửa công việc" : "Thêm công việc mới"}
          </span>
          <button onClick={onClose} style={{ background: COLORS.card, border: "none", borderRadius: 10, padding: 8, cursor: "pointer", color: COLORS.textMuted }}>
            <Icon name="close" size={18} />
          </button>
        </div>

        <div style={rowStyle}>
          <label style={labelStyle}>Tên công việc *</label>
          <input style={inputStyle} placeholder="Nhập tên công việc..." value={form.title} onChange={e => update("title", e.target.value)} />
        </div>

        <div style={rowStyle}>
          <label style={labelStyle}>Mô tả</label>
          <textarea style={{ ...inputStyle, height: 80, resize: "none" }} placeholder="Mô tả chi tiết..." value={form.description} onChange={e => update("description", e.target.value)} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <div><label style={labelStyle}>Ngày</label><input type="date" style={inputStyle} value={form.date} onChange={e => update("date", e.target.value)} /></div>
          <div><label style={labelStyle}>Người thực hiện</label><input style={inputStyle} placeholder="Tên..." value={form.assignee} onChange={e => update("assignee", e.target.value)} /></div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <div><label style={labelStyle}>Bắt đầu</label><input type="time" style={inputStyle} value={form.startTime} onChange={e => update("startTime", e.target.value)} /></div>
          <div><label style={labelStyle}>Kết thúc</label><input type="time" style={inputStyle} value={form.endTime} onChange={e => update("endTime", e.target.value)} /></div>
        </div>

        <div style={rowStyle}>
          <label style={labelStyle}>Địa điểm</label>
          <input style={inputStyle} placeholder="Địa điểm làm việc..." value={form.location} onChange={e => update("location", e.target.value)} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <div>
            <label style={labelStyle}>Độ ưu tiên</label>
            <select style={{ ...inputStyle, cursor: "pointer" }} value={form.priority} onChange={e => update("priority", e.target.value)}>
              {Object.entries(PRIORITY_CONFIG).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div>
            <label style={labelStyle}>Danh mục</label>
            <select style={{ ...inputStyle, cursor: "pointer" }} value={form.category} onChange={e => update("category", e.target.value)}>
              {Object.entries(CATEGORY_CONFIG).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
            </select>
          </div>
        </div>

        <div style={rowStyle}>
          <label style={labelStyle}>Trạng thái</label>
          <div style={{ display: "flex", gap: 8 }}>
            {Object.entries(STATUS_CONFIG).map(([k, v]) => (
              <button key={k} onClick={() => update("status", k)} style={{
                flex: 1, padding: "8px 4px", borderRadius: 10, border: `2px solid ${form.status === k ? v.color : COLORS.border}`,
                background: form.status === k ? v.bg : "transparent", color: form.status === k ? v.color : COLORS.textMuted,
                fontSize: 11, fontWeight: 600, cursor: "pointer", transition: "all 0.2s",
              }}>{v.label}</button>
            ))}
          </div>
        </div>

        <div style={rowStyle}>
          <label style={labelStyle}>Tags</label>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input style={{ ...inputStyle, flex: 1 }} placeholder="Thêm tag..." value={tagInput}
              onChange={e => setTagInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addTag()} />
            <button onClick={addTag} style={{ background: COLORS.accent, border: "none", borderRadius: 10, padding: "0 16px", color: "#fff", cursor: "pointer", fontWeight: 700 }}>+</button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {form.tags.map(t => (
              <span key={t} style={{ background: COLORS.accentSoft, color: COLORS.accent, borderRadius: 20, padding: "4px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 4 }}>
                {t}
                <button onClick={() => removeTag(t)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, padding: 0, fontSize: 14, lineHeight: 1 }}>×</button>
              </span>
            ))}
          </div>
        </div>

        <button onClick={handleSave} style={{
          width: "100%", padding: 16, background: `linear-gradient(135deg, ${COLORS.accent}, #7C3AED)`,
          border: "none", borderRadius: 14, color: "#fff", fontSize: 15, fontWeight: 700,
          cursor: "pointer", marginTop: 8, fontFamily: "'Sora', sans-serif", letterSpacing: "0.02em",
        }}>
          {task ? "Lưu thay đổi" : "Thêm công việc"}
        </button>
      </div>
    </div>
  );
}

// ─── Task Detail Modal ──────────────────────────────────────────────────────
function TaskDetail({ task, onClose, onEdit, onDelete, onStatusChange }) {
  const pri = PRIORITY_CONFIG[task.priority];
  const sta = STATUS_CONFIG[task.status];
  const cat = CATEGORY_CONFIG[task.category];

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 100, display: "flex", alignItems: "flex-end", backdropFilter: "blur(4px)" }}>
      <div style={{ background: COLORS.surface, borderRadius: "20px 20px 0 0", width: "100%", maxHeight: "88vh", overflowY: "auto", boxSizing: "border-box" }}>
        {/* Header */}
        <div style={{ padding: "24px 24px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
            <span style={{ background: cat.bg, color: cat.color, borderRadius: 10, padding: "5px 12px", fontSize: 12, fontWeight: 700 }}>
              {cat.icon} {cat.label}
            </span>
            <button onClick={onClose} style={{ background: COLORS.card, border: "none", borderRadius: 10, padding: 8, cursor: "pointer", color: COLORS.textMuted }}>
              <Icon name="close" size={18} />
            </button>
          </div>
          <h2 style={{ margin: "0 0 12px", fontSize: 20, fontWeight: 800, color: COLORS.text, fontFamily: "'Sora', sans-serif", lineHeight: 1.3 }}>{task.title}</h2>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
            <span style={{ background: pri.bg, color: pri.color, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 600 }}>{pri.dot} {pri.label}</span>
            <span style={{ background: sta.bg, color: sta.color, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 600 }}>{sta.icon} {sta.label}</span>
          </div>
        </div>

        <div style={{ height: 1, background: COLORS.border }} />

        <div style={{ padding: 24 }}>
          {task.description && (
            <div style={{ marginBottom: 20, background: COLORS.card, borderRadius: 14, padding: 16 }}>
              <p style={{ margin: 0, color: COLORS.textDim, fontSize: 14, lineHeight: 1.6 }}>{task.description}</p>
            </div>
          )}

          {[
            { icon: "clock", label: "Thời gian", value: `${task.startTime} – ${task.endTime}` },
            { icon: "calendar", label: "Ngày", value: (() => { const d = new Date(task.date + "T00:00:00"); return `${FULL_DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS_VN[d.getMonth()]} ${d.getFullYear()}`; })() },
            { icon: "user", label: "Người thực hiện", value: task.assignee || "Chưa phân công" },
            { icon: "map", label: "Địa điểm", value: task.location || "Chưa xác định" },
          ].map(item => (
            <div key={item.label} style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14, background: COLORS.card, borderRadius: 12, padding: "12px 16px" }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: COLORS.accentSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Icon name={item.icon} size={16} color={COLORS.accent} />
              </div>
              <div>
                <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em" }}>{item.label}</div>
                <div style={{ fontSize: 14, color: COLORS.text, fontWeight: 500 }}>{item.value}</div>
              </div>
            </div>
          ))}

          {task.tags.length > 0 && (
            <div style={{ 
